services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blindpay
      POSTGRES_PASSWORD: blindpay
      POSTGRES_DB: blindpay
    volumes:
      - blindpay_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blindpay -d blindpay"]
      interval: 3s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://blindpay:blindpay@postgres:5432/blindpay
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      PORT: 3000
      FRONTEND_URL: http://host.docker.internal:5173
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  blindpay_pg:
